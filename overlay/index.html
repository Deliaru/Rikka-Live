<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Rikka Live Overlay</title>
    <link rel="stylesheet" href="/overlay/overlay.css" />
  </head>
  <body>
    <div id="root" class="live2d-host" aria-hidden="true"></div>

    <main id="overlay-shell" class="overlay-shell" aria-label="Rikka Live overlay">
      <section
        id="subtitle-stage"
        class="subtitle-stage"
        data-anchor="bottom_left"
        aria-live="polite"
        aria-atomic="true"
      >
        <div id="subtitle-bubble" class="subtitle-bubble" hidden>
          <span class="subtitle-bubble__ribbon" aria-hidden="true"></span>
          <span class="subtitle-bubble__shine" aria-hidden="true"></span>
          <span class="subtitle-bubble__pearls" aria-hidden="true"></span>
          <span class="subtitle-bubble__tail-sparkle" aria-hidden="true"></span>
          <div class="subtitle-bubble__glow"></div>
          <p id="subtitle-text" class="subtitle-bubble__text"></p>
          <span class="subtitle-bubble__voice" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span
            id="subtitle-resize-handle"
            class="subtitle-bubble__resize"
            aria-hidden="true"
          ></span>
        </div>
      </section>

      <section
        id="asr-hud"
        class="asr-hud"
        data-state="idle"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <span id="asr-hud-state" class="asr-hud__state">ASR ready</span>
        <p id="asr-hud-text" class="asr-hud__text"></p>
        <small id="asr-hud-detail" class="asr-hud__detail"></small>
      </section>

      <section class="overlay-dock" data-open="false">
        <button id="dock-toggle" class="dock-toggle" type="button" aria-label="Toggle overlay controls">
          <span class="dock-toggle__mark">R</span>
        </button>
        <div class="dock-panel">
          <div class="dock-panel__header">
            <div>
              <p class="dock-kicker">Rikka Live</p>
              <h1>Overlay</h1>
            </div>
            <div class="dock-panel__tools">
              <button id="dock-drag-handle" class="dock-icon-button" type="button" aria-label="Drag overlay dock" title="Drag dock">::</button>
              <span id="ws-state" class="state-pill" data-state="connecting">connecting</span>
            </div>
          </div>
          <label class="field">
            <span>WebSocket</span>
            <input id="ws-url" type="text" value="/client-ws" spellcheck="false" />
          </label>
          <label class="field">
            <span>Character</span>
            <div class="field-row">
              <select id="config-select" aria-label="Character config">
                <option value="">loading</option>
              </select>
              <button id="switch-config" type="button">Switch</button>
            </div>
          </label>
          <fieldset class="model-layout" aria-label="Live2D layout">
            <legend>Live2D Layout</legend>
            <label class="range-field">
              <span>Scale <output id="model-scale-value">100%</output></span>
              <input id="model-scale" type="range" min="20" max="2600" step="0.1" value="520" />
            </label>
            <label class="range-field">
              <span>X <output id="model-x-value">0.00</output></span>
              <input id="model-x" type="range" min="-160" max="160" step="0.01" value="0" />
            </label>
            <label class="range-field">
              <span>Y <output id="model-y-value">0.00</output></span>
              <input id="model-y" type="range" min="-120" max="120" step="0.01" value="0" />
            </label>
            <button id="reset-model-layout" type="button">Reset layout</button>
          </fieldset>
          <div class="dock-actions">
            <button id="connect-ws" type="button">Reconnect</button>
            <button id="mic-toggle" type="button" data-active="false">Mic</button>
            <button id="hud-toggle" type="button" data-active="true">Hide HUD</button>
            <button id="reset-dock-position" type="button">Reset dock</button>
          </div>
          <dl class="status-grid">
            <div>
              <dt>Model</dt>
              <dd id="model-state">waiting</dd>
            </div>
            <div>
              <dt>Capture</dt>
              <dd id="capture-state">disabled</dd>
            </div>
            <div>
              <dt>Wake</dt>
              <dd id="wake-state">off</dd>
            </div>
            <div>
              <dt>ASR</dt>
              <dd id="asr-state">idle</dd>
            </div>
            <div>
              <dt>Motion</dt>
              <dd id="motion-state">loading</dd>
            </div>
          </dl>
          <div class="asr-panel" aria-live="polite">
            <strong id="asr-transcript">No transcript yet</strong>
            <small id="asr-detail">ASR status will appear here.</small>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/overlay/subtitle-bubble.js"></script>
    <script type="module" src="/overlay/live2d-natural-motion.js"></script>
    <script type="module" src="/overlay/live2d-runtime.js"></script>
    <script type="module" src="/overlay/overlay.js"></script>
  </body>
</html>
